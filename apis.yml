name: Nopan
description: >-
  Nopan is a specialized Payment Service Provider (PSP), built by former merchants
  and Netflix payments leaders, focused exclusively on European account and wallet
  payment methods (Wero, BLIK, Bizum, Satispay, IRIS). It exposes a single
  standardized API for account-to-account (A2A) and wallet payments with
  conversion-optimized flows, PSP-agnostic tokenization for recurring and
  merchant-initiated payments, a multi-currency settlement and reconciliation
  engine, normalized transaction data, and a real-time monitoring Portal.
  Authentication is OAuth2 client_credentials over mutual TLS with JWS request
  signing. Nopan is licensed as a Payment Institution by De Nederlandsche Bank (DNB)
  and is PSD2/SCA compliant. Backed by Newion, Crane, and Seedcamp.
