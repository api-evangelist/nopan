arazzo: 1.0.1
info:
  title: Nopan — refund a captured payment
  version: 1.0.0
  summary: Authenticate, refund a previously captured payment, and confirm via events.
  x-realizes-capability-ids:
  - BC-1340.20
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-1340.20
      capability_name: Payment Processing Management
      spec: nopan-payment-processing-apis-api-openapi.yml
      confidence: 0.85
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: authenticationApisApi
  url: ../openapi/nopan-authentication-apis-api-openapi.yml
  type: openapi
- name: paymentProcessingApisApi
  url: ../openapi/nopan-payment-processing-apis-api-openapi.yml
  type: openapi
workflows:
- workflowId: refundCapturedPayment
  summary: Get a token, refund a captured payment, and read the events timeline.
  inputs:
    type: object
    properties:
      client_id:
        type: string
      scope:
        type: string
        default: payments:process
      transactionId:
        type: string
  steps:
  - stepId: authenticate
    operationId: getAccessToken
    requestBody:
      contentType: application/x-www-form-urlencoded
      payload:
        grant_type: client_credentials
        client_id: $inputs.client_id
        scope: $inputs.scope
    outputs:
      access_token: $response.body#/access_token
  - stepId: refund
    operationId: refundPayment
  - stepId: events
    operationId: getPaymentEvents
    parameters:
    - name: transactionId
      in: path
      value: $inputs.transactionId
