overlay: 1.0.0
info:
  title: API Evangelist enhancements for Nopan API
  version: 1.0.0
extends: openapi/nopan-openapi-original.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-20'
      x-apievangelist-provider: nopan
      x-apievangelist-category: payments
      x-idempotency-header: Idempotency-Key
      x-auth: OAuth2 client_credentials over mTLS with JWS request signing
  - target: $.info
    update:
      x-apievangelist-artifacts:
        authentication: authentication/nopan-authentication.yml
        scopes: scopes/nopan-scopes.yml
        conventions: conventions/nopan-conventions.yml
        errors: errors/nopan-error-codes.yml
        webhooks: asyncapi/nopan-webhooks.yml
        conformance: conformance/nopan-conformance.yml
